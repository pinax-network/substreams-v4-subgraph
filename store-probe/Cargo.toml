[package]
name = "uniswap-v4-state-store-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Downstream probe for the cache-stable Uniswap v4 state Stores"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
graph-bigdecimal = { package = "bigdecimal", version = "=0.1.2" }
graph-num-bigint = { package = "num-bigint", version = "=0.2.6" }
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
prost = "=0.13.5"
substreams = "=0.7.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
