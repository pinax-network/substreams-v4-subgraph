specVersion: v0.1.0
package:
  name: uniswap_v4_base_store_fed_reducer
  version: v0.1.0
  url: https://github.com/pinax-network/substreams-graph-node-backfill
  description: Cache-stable Store-fed inputs for the Base Uniswap v4 Graph Node reducer

# Import the immutable v0.2.0 Store package instead of rebuilding its writers.
# This preserves all four released module hashes and reuses their existing
# production cache. Only the downstream reducer-input map is new.
imports:
  state: ./downloads/uniswap-v4-base-state-stores-v0.1.0.spkg

protobuf:
  files:
    - reducer_inputs.proto
  importPaths:
    - ./stores/proto
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  reducer_inputs:
    type: wasm/rust-v1
    file: ./store-probe/target/wasm32-unknown-unknown/release/uniswap_v4_state_store_probe.wasm

modules:
  - name: store_pool_tick
    use: state:store_pool_tick

  - name: store_pool_transaction_count
    use: state:store_pool_transaction_count

  - name: store_tick_liquidity
    use: state:store_tick_liquidity

  - name: store_pool_liquidity
    use: state:store_pool_liquidity

  - name: map_reducer_inputs
    kind: map
    binary: reducer_inputs
    initialBlock: 25350988
    inputs:
      - map: state:events:map_events
      - store: store_tick_liquidity
        mode: deltas
    output:
      type: proto:pinax.uniswap.v4.base.store.v1.ReducerInputs

network: base
