specVersion: v0.1.0
package:
  name: uniswap_v4_base_backfill
  version: v0.1.1
  url: https://github.com/pinax-network/substreams-v4-subgraph
  description: Exact deployed-event stream for the Base Uniswap v4 Graph Node backfill

protobuf:
  files:
    - events.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams_v4_subgraph.wasm

modules:
