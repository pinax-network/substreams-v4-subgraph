      - store: store_tick_liquidity_12
        mode: deltas
      - store: store_tick_liquidity_13
        mode: deltas
      - store: store_tick_liquidity_14
        mode: deltas
      - store: store_tick_liquidity_15
        mode: deltas
    output:
      type: proto:pinax.uniswap.v4.base.store.v1.ReducerInputs

network: base
