  - name: store_pool_token_decimals
    kind: store
    binary: pool_metadata
    initialBlock: 25350988
    updatePolicy: set
    valueType: bigint
    inputs:
      - map: state:events:map_events
      - store: store_token_decimals

  - name: map_store_state_inputs
    kind: map
    binary: reducer_inputs
    initialBlock: 25350988
    inputs:
      - map: state:events:map_events
      - store: store_pool_tick
      - store: store_pool_sqrt_price
      - store: store_pool_liquidity
      - store: store_pool_transaction_count
      - store: store_pool_token_decimals
      - store: store_tick_liquidity_00
