specVersion: v0.1.0
package:
  name: uniswap_v4_base_store_state_reducer
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-graph-node-backfill
  description: Store-owned Pool/Tick state with size-bounded Tick shards and cached Graph Decimal computations

# Reuse the three immutable, size-safe v0.2.0 Store modules and their existing
# cache. The legacy Tick Store is intentionally not imported because it reaches
# the server's 2 GiB per-Store ceiling on Base. Sixteen deterministic shards
# preserve its exact keys and deltas while bounding each Store independently.
imports:
  state: ./downloads/uniswap-v4-base-state-stores-v0.1.0.spkg

protobuf:
  files:
    - reducer_inputs.proto
  importPaths:
    - ./stores/proto
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  state_v2:
    type: wasm/rust-v1
    file: ./store-state/target/wasm32-unknown-unknown/release/uniswap_v4_store_state_v2.wasm
  pool_metadata:
    type: wasm/rust-v1
    file: ./store-metadata/target/wasm32-unknown-unknown/release/uniswap_v4_store_pool_metadata.wasm
  reducer_inputs:
    type: wasm/rust-v1
    file: ./store-probe/target/wasm32-unknown-unknown/release/uniswap_v4_state_store_probe.wasm
  tick_shards:
    type: wasm/rust-v1
    file: ./store-tick-shards/target/wasm32-unknown-unknown/release/uniswap_v4_store_tick_shards.wasm

modules:
  - name: store_pool_tick
    use: state:store_pool_tick

  - name: store_pool_transaction_count
    use: state:store_pool_transaction_count

  - name: store_pool_liquidity
    use: state:store_pool_liquidity

  - name: store_tick_liquidity_00
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_01
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_02
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_03
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_04
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_05
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_06
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_07
    kind: store
    binary: tick_shards
    initialBlock: 25350988
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: state:events:map_events

  - name: store_tick_liquidity_08
    kind: store
