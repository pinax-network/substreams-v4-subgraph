      - store: store_tick_liquidity_01
        mode: deltas
      - store: store_tick_liquidity_02
        mode: deltas
      - store: store_tick_liquidity_03
        mode: deltas
      - store: store_tick_liquidity_04
        mode: deltas
      - store: store_tick_liquidity_05
