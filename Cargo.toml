[package]
name = "substreams-v4-subgraph"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Pinned Uniswap v4 Base event extraction Substreams"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ethabi = "=17.2.0"
prost = "=0.13.5"
prost-types = "=0.13.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.142", features = ["arbitrary_precision"] }
substreams = "=0.7.6"
substreams-ethereum = "=0.11.1"
thiserror = "=2.0.12"

[build-dependencies]
anyhow = "=1.0.98"
serde_json = "=1.0.142"
substreams-ethereum = "=0.11.1"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "=0.2.16", features = ["custom"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
