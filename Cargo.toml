[package]
name = "substreams-v4-subgraph"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Graph Node-compatible Uniswap v4 Base backfill Substreams"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ethabi = "=17.2.0"
graph-bigdecimal = { package = "bigdecimal", version = "=0.1.2" }
graph-num-bigint = { package = "num-bigint", version = "=0.2.6" }
num-bigint = { version = "=0.4.6", features = ["serde"] }
num-traits = "=0.2.19"
prost = "=0.13.5"
prost-types = "=0.13.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.142", features = ["arbitrary_precision"] }
substreams = "=0.7.6"
substreams-ethereum = "=0.11.1"
thiserror = "=2.0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arrow = { version = "=58.3.0", optional = true }
arrow-arith = { version = "=58.3.0", optional = true }
arrow-array = { version = "=58.3.0", optional = true }
arrow-buffer = { version = "=58.3.0", optional = true }
arrow-cast = { version = "=58.3.0", optional = true }
arrow-csv = { version = "=58.3.0", optional = true }
arrow-data = { version = "=58.3.0", optional = true }
arrow-ipc = { version = "=58.3.0", optional = true }
arrow-json = { version = "=58.3.0", optional = true }
arrow-ord = { version = "=58.3.0", optional = true }
arrow-row = { version = "=58.3.0", optional = true }
arrow-schema = { version = "=58.3.0", optional = true }
arrow-select = { version = "=58.3.0", optional = true }
arrow-string = { version = "=58.3.0", optional = true }
parquet = { version = "=58.3.0", features = ["arrow", "zstd"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
stable-hash = { git = "https://github.com/graphprotocol/stable-hash", rev = "e50aabef55b8c4de581ca5c4ffa7ed8beed7e998", optional = true }
stable-hash-legacy = { package = "stable-hash", git = "https://github.com/graphprotocol/stable-hash", rev = "7af76261e8098c58bfadd5b7c31810e1c0fdeccb", optional = true }

[build-dependencies]
anyhow = "=1.0.98"
serde_json = "=1.0.142"
substreams-ethereum = "=0.11.1"

[features]
native = [
    "dep:arrow",
    "dep:arrow-arith",
    "dep:arrow-array",
    "dep:arrow-buffer",
    "dep:arrow-cast",
    "dep:arrow-csv",
    "dep:arrow-data",
    "dep:arrow-ipc",
    "dep:arrow-json",
    "dep:arrow-ord",
    "dep:arrow-row",
    "dep:arrow-schema",
    "dep:arrow-select",
    "dep:arrow-string",
    "dep:parquet",
    "dep:sha2",
    "dep:stable-hash",
    "dep:stable-hash-legacy",
]

[[bin]]
name = "state-replay"
path = "src/bin/state-replay.rs"
required-features = ["native"]

[[bin]]
name = "parquet-backfill"
path = "src/bin/parquet-backfill.rs"
required-features = ["native"]

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "=0.2.16", features = ["custom"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
