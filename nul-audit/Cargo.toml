[package]
name = "uniswap-v4-base-nul-audit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stateless audit of NUL-bearing Uniswap v4 Base token metadata"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "=0.13.5"
substreams = "=0.7.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
